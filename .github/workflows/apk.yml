{"name": "Generar APK",
"on": {"push": {}, "workflow_dispatch": {}},
"permissions": {"contents": "write"},
"jobs": {"apk": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v5"},
{"uses": "actions/setup-java@v5", "with": {"distribution": "temurin", "java-version": "17"}},
{"name": "Construir la APK", "run": "N=$(ls *.zip 2>/dev/null | wc -l); if [ \"$N\" -gt 1 ]; then echo 'Hay varios .zip en el repositorio: deje solo uno.'; ls *.zip; exit 1; fi; if [ \"$N\" -eq 1 ]; then echo \"Descomprimiendo $(ls *.zip)\"; unzip -q -o ./*.zip -d \"$RUNNER_TEMP/codigo\"; cd \"$RUNNER_TEMP/codigo\"; fi; G=$(find . -path '*/android/gradlew' | head -1); if [ -z \"$G\" ]; then echo 'No encuentro la carpeta android. Esto es lo que hay:'; ls -R | head -60; exit 1; fi; echo \"Proyecto Android en $(dirname $G)\"; cd \"$(dirname $G)\" && chmod +x gradlew && ./gradlew --no-daemon assembleRelease && mkdir -p \"$GITHUB_WORKSPACE/salida-apk\" && cp app/build/outputs/apk/release/app-release.apk \"$GITHUB_WORKSPACE/salida-apk/CheckListElevadores.apk\""},
{"name": "Publicar en Releases", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "v${{ github.run_number }}", "name": "Check-list elevadores ${{ github.run_number }}", "body": "Descargue CheckListElevadores.apk e instalela en la tableta.", "files": "salida-apk/CheckListElevadores.apk", "make_latest": true}}
]}}}
